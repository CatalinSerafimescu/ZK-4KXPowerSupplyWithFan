<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Steaming cup of coffee">
  <style>
    .steam { fill: none; stroke: #9aa0a6; stroke-width: 4; stroke-linecap: round; opacity: 0; animation: rise 3s ease-in-out infinite; }
    .d1 { animation-delay: 1s; }
    .d2 { animation-delay: 2s; }
    @keyframes rise {
      0%   { opacity: 0;  transform: translateY(8px); }
      35%  { opacity: .9; }
      100% { opacity: 0;  transform: translateY(-12px); }
    }
  </style>
  <path class="steam"    d="M44 52c-5-6 5-10 0-16s5-10 0-16"/>
  <path class="steam d1" d="M58 50c-5-6 5-10 0-16s5-10 0-16"/>
  <path class="steam d2" d="M72 52c-5-6 5-10 0-16s5-10 0-16"/>
  <ellipse cx="56" cy="102" rx="40" ry="6" fill="#7a4a32"/>
  <path d="M84 64h5a9 9 0 0 1 0 18h-7" fill="none" stroke="#b5774f" stroke-width="5"/>
  <path d="M28 58H84V74C84 90 74 98 56 98S28 90 28 74Z" fill="#b5774f"/>
  <ellipse cx="56" cy="58" rx="28" ry="4" fill="#4a2c1d"/>
</svg>
